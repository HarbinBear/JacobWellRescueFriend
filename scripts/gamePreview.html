<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEEPTAPE · 实装游戏</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e5e1d5;color:#384435;font:12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{display:flex;gap:38px;align-items:center;justify-content:center;min-height:100svh;padding:20px}.phone{height:min(820px,calc(100svh - 40px));aspect-ratio:375/667;box-shadow:0 18px 50px #15221925;background:#09151a;border-radius:4px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}aside{max-width:240px}h1{font-size:25px;line-height:1.4;letter-spacing:-1px;margin:12px 0}small{font:10px monospace;letter-spacing:2px;color:#a3472e}p{line-height:1.9;color:#77806d}button{font:inherit;border:1px solid #b4b9a8;background:transparent;color:#435440;padding:10px 12px;margin:5px 4px 5px 0;cursor:pointer;border-radius:2px}button:disabled{opacity:.4;cursor:default}button:hover:enabled{background:#d1d6c5}button:focus-visible{outline:2px solid #a3472e;outline-offset:3px}output{display:block;border-top:1px solid #c2c5b7;padding-top:14px;margin-top:17px;font:11px monospace}a{color:#a3472e}@media(max-width:650px){main{display:block;padding:0}.phone{height:100svh;margin:auto;max-width:100%;border-radius:0}aside{padding:18px;max-width:none}aside h1{font-size:20px}}</style></head><body><main>
<div class="phone"><canvas id="game" aria-label="游戏画面：点击一键下潜，先倒带，再入水播放"></canvas></div>
<aside><small>DEEPTAPE / IN GAME</small><h1>一键下潜。</h1><p>主界面 → 倒带准备 → 入水 → 按下播放。<br>音乐响起，曲名短暂出现。</p><p>点击游戏里的「一键下潜」。<br>鼠标拖动 / WASD 游动。</p><button id="menu">回主界面</button><button id="target" disabled>评审：查看相遇</button><button id="light" disabled>关闭手电</button><output id="phase" role="status">主界面</output><p style="font-size:10px">真实游戏代码与音乐。浏览器使用独立存档；云端环境音与音效由微信端提供。</p><a href="index.html">磁带与分轨预览 ↗</a></aside></main>
<script>
(()=>{window.GameGlobal=window;const canvas=document.getElementById('game'),handlers={},pointers=new Map(),lifecycle={};let first=true;
const audioStub=()=>{const events={};return new Proxy({play(){},pause(){},stop(){},seek(){},destroy(){},loop:false,volume:0,src:''},{get(o,k){if(k in o)return o[k];if(String(k).startsWith('on'))return fn=>events[k]=fn;return undefined},set(o,k,v){o[k]=v;if(k==='src')queueMicrotask(()=>events.onCanplay&&events.onCanplay());return true}})};
window.wx={createCanvas(){if(first){first=false;return canvas}return document.createElement('canvas')},getWindowInfo:()=>({windowWidth:375,windowHeight:667,pixelRatio:2}),createWebAudioContext:()=>new (window.AudioContext||window.webkitAudioContext)(),createInnerAudioContext:audioStub,createImage:()=>{const img=new Image();const desc=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');Object.defineProperty(img,'src',{get(){return desc.get.call(img)},set(value){desc.set.call(img,'../../'+value)}});return img},getStorageSync:key=>{try{return JSON.parse(localStorage.getItem('deeptape-game-review/'+key)||'null')||''}catch{return ''}},setStorageSync:(key,value)=>localStorage.setItem('deeptape-game-review/'+key,JSON.stringify(value)),removeStorageSync:key=>localStorage.removeItem('deeptape-game-review/'+key),onTouchStart:fn=>handlers.start=fn,onTouchMove:fn=>handlers.move=fn,onTouchEnd:fn=>handlers.end=fn,onTouchCancel:fn=>handlers.cancel=fn,onHide:fn=>lifecycle.hide=fn,onShow:fn=>lifecycle.show=fn,setPreferredFramesPerSecond(){}};
function touch(e){const r=canvas.getBoundingClientRect();return {identifier:e.pointerId,clientX:(e.clientX-r.left)*375/r.width,clientY:(e.clientY-r.top)*667/r.height}}
for(const [event,kind] of [['pointerdown','start'],['pointermove','move'],['pointerup','end'],['pointercancel','cancel']])canvas.addEventListener(event,e=>{if(kind==='move'&&!pointers.has(e.pointerId))return;e.preventDefault();const t=touch(e);if(kind==='start'){canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,t)}else if(kind==='move')pointers.set(e.pointerId,t);else pointers.delete(e.pointerId);if(handlers[kind])handlers[kind]({touches:[...pointers.values()],changedTouches:[t]})});
document.addEventListener('keydown',e=>{if(e.code==='Space')e.preventDefault()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(lifecycle.hide)lifecycle.hide()}else if(lifecycle.show)lifecycle.show()});
})();
</script><script src="game-runtime.js"></script><script>
document.getElementById('menu').onclick=()=>DeepTapeGame.menu();document.getElementById('target').onclick=()=>DeepTapeGame.nearTarget();
document.getElementById('light').onclick=()=>{DeepTapeGame.state.flashlightOn=DeepTapeGame.state.flashlightOn===false};
setInterval(()=>{if(!window.DeepTapeGame)return;const state=DeepTapeGame.state,phase=state.screen==='menu'?'menu':state.mazeRescue?.phase;const names={menu:'主界面',tape_rewind:'倒带准备 · 世界冻结',diving_in:'入水',tape_play:'按下 PLAY',play:'水下 · 音乐播放中',shore:'营地',failed:'撤离中'};document.getElementById('phase').textContent=names[phase]||phase;document.getElementById('target').disabled=phase!=='play';document.getElementById('light').disabled=phase!=='play';document.getElementById('light').textContent=state.flashlightOn===false?'开启手电':'关闭手电'},120);
</script></body></html>
