<aside><small>DEEPTAPE / FISH HANDLING</small><h1>指哪儿，做哪儿。</h1><p>实际游戏代码，模拟持续运行。<br>按住「动作」，用方向与拖动距离预选。<br>准星标出敲击点，割线会高亮具体缺口。</p><p>绳盘选鱼起绳，再拖到外侧「自己」系腰扣。<br>动作盘外侧可选具体腰绳解除。<br>移回中心取消预选；移动取消动画。</p><button onclick="DeepTapeGame.interactions.setup('rammer',false)">布置诱捕场景</button><button onclick="DeepTapeGame.interactions.setup('rammer',true)">近身练习：已入网</button><button onclick="DeepTapeGame.interactions.near('head')">移到鱼头旁</button><button onclick="DeepTapeGame.interactions.near('knot')">移到绑绳位置</button><button onclick="DeepTapeGame.interactions.near('net')">移到缠网位置</button><button id="light" disabled>开启手电</button><button id="menu">退出试跑</button><button id="target" hidden></button><button id="link" hidden></button><output id="phase" role="status">主界面</output><p>场景布置按钮仅供此浏览器练习。<br>游戏内仍只有动作按钮和原绳盘。<br>WASD / 拖动游泳。真机性能待验收。</p></aside></main>
